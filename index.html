<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Proxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f23;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
        }
        .header {
            padding: 40px 20px 20px;
        }
        h1 {
            font-size: 42px;
            margin: 0;
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .search-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }
        input {
            width: 100%;
            padding: 18px 25px;
            font-size: 19px;
            border: 2px solid #00ffcc;
            border-radius: 50px;
            background: #1a1a2e;
            color: white;
            outline: none;
        }
        button {
            margin-top: 15px;
            padding: 15px 50px;
            font-size: 18px;
            background: #00ffcc;
            color: black;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        iframe {
            margin-top: 20px;
            width: 95%;
            max-width: 1300px;
            height: 75vh;
            border: none;
            border-radius: 12px;
            background: #ffffff;
        }
        .note {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 Universal Proxy</h1>
        <p>Access any website or game</p>
    </div>

    <div class="search-container">
        <input type="text" id="urlInput" placeholder="Type any URL here (e.g. google.com or coolmathgames.com)" autocomplete="off">
        <br><br>
        <button onclick="loadSite()">🚀 Go</button>
    </div>

    <iframe id="proxyFrame" src="about:blank"></iframe>

    <div class="note">
        💡 Tip: Press Enter after typing the URL
    </div>

    <script>
        function loadSite() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) {
                alert("Please enter a website or game URL");
                return;
            }

            let url = input;
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            // Best free proxy currently available for GitHub Pages
            const proxiedUrl = `https://corsproxy.io/?` + encodeURIComponent(url);
            document.getElementById('proxyFrame').src = proxiedUrl;
        }

        // Allow pressing Enter key
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadSite();
            }
        });
    </script>
</body>
</html>
